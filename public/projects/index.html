<!doctype html>
<html lang="en" data-theme="dark" class="project-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Project · Irfaan</title>
  <meta name="description" content="A project from Irfaan's portfolio, presented as an architectural elevation that draws itself.">
  <meta name="theme-color" content="#0c0d0d">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/projects/project.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="crest" href="/" aria-label="MI, home">
        <svg class="logo" viewBox="0 0 106 100" aria-hidden="true">
          <path class="logo-m" d="M14 86V16h15l12 36 12-36h15v70H58V44L46 76H36L24 44v42z"/>
          <g transform="translate(82 84) rotate(15)"><g class="logo-hand"><path d="M-1.4 11 L-1.4 0 L0 -72 L1.4 0 L1.4 11 Z"/><path d="M0 -61 L4.2 -50 L0 -39 L-4.2 -50 Z"/><circle cy="13" r="2.6"/><circle r="4.4"/><circle class="logo-pin" r="1.6"/></g></g>
        </svg>
      </a>
      <nav class="nav" aria-label="Project">
        <a href="/#projects" class="back-link"><span aria-hidden="true">&larr;</span> All projects</a>
      </nav>
      <span class="pj-count" id="pj-count" aria-hidden="true"></span>
    </div>
  </header>

  <!-- The drawing: fixed behind the page -->
  <div class="stage" aria-hidden="true">
    <div class="stage-frame">
      <img class="stage-photo" id="pj-photo" alt="" decoding="async" hidden>
      <svg class="fx" id="fx" preserveAspectRatio="xMidYMid meet" focusable="false"></svg>
      <noscript><img class="stage-static" src="/assets/projects/mansard-riyadh-elevation.svg" alt=""></noscript>
    </div>
  </div>

  <main class="pj" id="top">
    <section class="pj-hero">
      <div class="pj-overlay">
        <div class="pj-titles">
          <p class="eyebrow" id="pj-eyebrow">Project</p>
          <h1 class="pj-title" id="pj-title">Mansard Riyadh</h1>
          <p class="pj-loc" id="pj-loc">Riyadh, Saudi Arabia</p>
        </div>
        <dl class="pj-meta" id="pj-meta"></dl>
        <div class="pj-actions">
          <button class="pj-btn" type="button" id="pj-replay">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v2.8h-2.8"/></svg>
            Replay drawing
          </button>
          <button class="pj-btn" type="button" id="pj-photo-toggle" hidden aria-pressed="false">Show photograph</button>
          <a class="pj-btn pj-btn-ghost" href="#story">About the project <span aria-hidden="true">&darr;</span></a>
        </div>
      </div>
    </section>

    <section class="pj-body" id="story">
      <div class="pj-body-inner">
        <header class="section-label">
          <span class="section-num">The project</span>
          <h2 id="pj-h2">Mansard Riyadh</h2>
        </header>
        <div>
          <p class="pj-summary" id="pj-summary"></p>
          <div class="pj-story" id="pj-story"></div>
          <div class="tally pj-tally" id="pj-facts"></div>
          <div class="pj-cols">
            <div>
              <h3>Programme</h3>
              <ul class="pj-list" id="pj-programme"></ul>
            </div>
            <div>
              <h3>My role</h3>
              <p id="pj-role"></p>
            </div>
          </div>
          <p class="pj-caption">The elevation is an illustrative drawing of the building, made for this portfolio. It is not a construction drawing.</p>
          <nav class="pj-next" id="pj-next" aria-label="More projects"></nav>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>© <span id="year">2026</span> Irfaan</span>
    <a href="/#projects">All projects</a>
  </footer>

  <script src="/projects/data.js" defer></script>
  <script src="/projects/facade.js" defer></script>
  <script src="/projects/project.js" defer></script>
</body>
</html>
